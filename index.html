<html lang="ko">
<head>

  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'">
  <title>Brand Growth — 브랜드 성장 대시보드</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml"><link rel="stylesheet" href="styles.css?v=20261014-auto-scenarios"><link rel="stylesheet" href="forecast.css?v=20261014-auto-scenarios">

</head>
<body>
<a class="skip" href="#main">본문으로 이동</a>
<aside class="sidebar">
 <a class="wordmark" href="#overview"><span class="logo">b<span>↗</span></span><span>brand growth<small>YOUR GROWTH WORKSPACE</small></span></a>
 <div class="brand-block"><label for="brand-select">WORKSPACE</label><select id="brand-select" aria-label="브랜드 선택"></select><button id="add-brand" class="text-button">＋ 새 브랜드</button></div>
 <nav id="nav" aria-label="주 메뉴"></nav>
 <div class="sidebar-bottom"><span class="storage-dot"></span> 이 브라우저에 저장<small>기록은 외부 서버로 전송되지 않습니다.</small><button class="text-button" id="backup-side">↗ 전체 기록 백업</button></div>
</aside>
<div class="workspace">
 <header class="topbar"><div class="breadcrumb">Workspace <span>/</span> <strong id="brand-label"></strong></div><div class="top-actions"><span id="save-state" role="status">저장 준비</span><button class="button" id="import-button">가져오기</button><button class="button primary" id="new-record">＋ 지표 입력</button></div></header>
 <main id="main" tabindex="-1"></main>
 <footer>Brand Growth <span>기간과 출처를 함께 기록하고, 같은 기준으로 비교하세요.</span></footer>
</div>
<dialog id="modal"><div id="modal-content"></div></dialog>
<input id="file-input" type="file" accept=".json,.csv,application/json,text/csv" hidden>
<div id="toast" role="status" aria-live="polite"></div>
